    /* ---------- Live processing-time clock (adopted from Manual Typing) ----------
       Each order accumulates closed segments ({status, start, end}) in
       order.segments, plus a currently-running segment tracked via
       order.runningSince / order.runningStatus. Changing the status
       select closes the segment running under the old status and opens
       a new one under the new status (unless the new status isn't
       tracked, or the order is on Hold). The Hold button is separate
       from status: it freezes the clock without recording a segment
       for the held time, so held time never counts toward Processing
       Time — resuming picks back up under whatever status is set. */
    function closeRunningSegment(order, now) {
      if (order.runningSince) {
        order.segments.push({ status: order.runningStatus, start: order.runningSince, end: now });
        order.runningSince = null;
        order.runningStatus = null;
      }
    }
    function liveSegments(order) {
      const segs = order.segments.slice();
      if (order.runningSince) segs.push({ status: order.runningStatus, start: order.runningSince, end: demoNow() });
      return segs;
    }
    function entryElapsedMs(order) {
      return liveSegments(order).reduce((sum, s) => sum + Math.max(0, s.end - s.start), 0);
    }
    function formatDuration(ms) {
      if (!ms || ms < 0) ms = 0;
      const totalSec = Math.floor(ms / 1000);
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = n => String(n).padStart(2, '0');
      return (days > 0 ? days + 'd ' : '') + pad(hours) + ':' + pad(mins) + ':' + pad(secs);
    }

    /* ---------- Break Down (adopted from Manual Typing) ----------
       Sums the same closed segments Processing Time uses, but grouped
       by calendar date and then by status within that date, so work
       that resumes on a later day shows up as its own date group. */
    function formatSegDate(ts) {
      return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function groupedBreakdown(order) {
      const segments = liveSegments(order).filter(s => BREAKDOWN_LABELS[s.status]);
      const dateOrder = [];
      const byDate = {};
      segments.forEach(s => {
        const dateKey = formatSegDate(s.start);
        if (!byDate[dateKey]) { byDate[dateKey] = {}; dateOrder.push(dateKey); }
        const label = BREAKDOWN_LABELS[s.status];
        byDate[dateKey][label] = (byDate[dateKey][label] || 0) + Math.max(0, s.end - s.start);
      });
      return dateOrder.map(dateKey => ({ dateKey, parts: Object.entries(byDate[dateKey]) }));
    }
    function entryBreakdownHtml(order) {
      const groups = groupedBreakdown(order);
      if (!groups.length) return '<span class="bd-empty">&mdash;</span>';
      const lines = groups.map(g => '<span class="bd-date">' + escapeHtml(g.dateKey) + '</span>' +
        g.parts.map(([label, ms]) => '<br><span class="bd-part">' + escapeHtml(label) + ' ' + formatDuration(ms) + '</span>').join(''));
      return lines.join('<br>');
    }
    function entryBreakdownText(order) {
      const groups = groupedBreakdown(order);
      if (!groups.length) return '';
      return groups.map(g => g.dateKey + ': ' +
        g.parts.map(([label, ms]) => label + ' ' + formatDuration(ms)).join(', ')).join(' | ');
    }
    function entryBreakdownEditText(order) {
      const groups = groupedBreakdown(order);
      if (!groups.length) return '';
      return groups.map(g => g.dateKey + '\n' +
        g.parts.map(([label, ms]) => label + ' ' + formatDuration(ms)).join('\n')).join('\n');
    }
    function formatBreakdownLines(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return '<span class="bd-empty">&mdash;</span>';
      return lines.map(line => {
        const isPart = /\d{1,2}:\d{2}(:\d{2})?/.test(line);
        return isPart
          ? '<span class="bd-part">' + escapeHtml(line) + '</span>'
          : '<span class="bd-date">' + escapeHtml(line) + '</span>';
      }).join('<br>');
    }
    function breakdownCellHtml(order) {
      if (order.breakdownOverride) {
        return '<span class="js-breakdown" data-id="' + order.id + '">' + formatBreakdownLines(order.breakdownOverride) + '</span>';
      }
      return '<span class="js-breakdown" data-id="' + order.id + '">' + entryBreakdownHtml(order) + '</span>';
    }
    function parseDurationToken(token) {
      const match = String(token).trim().match(/(?:(\d+)\s*d\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?\s*$/i);
      if (!match) return null;
      const days = match[1] ? Number(match[1]) : 0;
      const hours = Number(match[2]);
      const mins = Number(match[3]);
      const secs = match[4] != null ? Number(match[4]) : 0;
      return ((days * 24 + hours) * 3600 + mins * 60 + secs) * 1000;
    }
    function parseBreakdownDurationMs(text) {
      if (!text) return null;
      const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
      let total = 0, matched = false;
      lines.forEach(line => {
        if (!/\d{1,2}:\d{2}(:\d{2})?/.test(line)) return;
        const ms = parseDurationToken(line);
        if (ms != null) { total += ms; matched = true; }
      });
      return matched ? total : null;
    }

    /* ---------- Market dropdown / Country combobox ----------
       Country is a text input with a <datalist> of suggestions rather
       than a plain <select> — so it still accepts a free-typed value —
       but the suggestions themselves are narrowed to whichever market is
       currently selected (see refreshCountryOptions), not every country
       tracked dashboard-wide. Buffer has no fixed country list of its own
       (per MARKETS' dynamicCountries flag), so it gets no suggestions at
       all — just a plain free-text box for typing a real country. */
    const inMarket = document.getElementById('inMarket');
    const inCountry = document.getElementById('inCountry');
    const inCountryList = document.getElementById('inCountryList');

    inMarket.innerHTML = '<option value="" disabled selected hidden>Select\u2026</option>' +
      MARKETS.map(m => '<option value="' + m.code + '">' + m.code + '</option>').join('');

    // Kept for the per-row <select> in the Order Requests table below
    // (still used for markets with a fixed country list).
    function countryOptionsHtml(marketCode, selectedCountry) {
      const market = MARKETS.find(m => m.code === marketCode);
      if (!market || !market.countries.length) return '';
      return market.countries
        .map(c => '<option value="' + c.code + '"' + (c.code === selectedCountry ? ' selected' : '') + '>' + c.code + ' - ' + c.label + '</option>')
        .join('');
    }
    function refreshCountryOptions() {
      const market = MARKETS.find(m => m.code === inMarket.value);
      inCountry.disabled = false;
      if (market && market.countries.length) {
        // Fixed-list market — narrow the dropdown to just its own
        // countries, so picking one is a couple of keystrokes instead of
        // scrolling through every country on the dashboard.
        inCountryList.innerHTML = countryDatalistOptionsHtml(market.countries);
        inCountry.value = '';
        inCountry.placeholder = 'Country';
      } else {
        // Buffer (dynamicCountries) has no fixed list of its own, so
        // there's nothing meaningful to suggest — leave it a plain
        // free-text box with no dropdown at all.
        inCountryList.innerHTML = '';
        inCountry.value = '';
        inCountry.placeholder = market && market.dynamicCountries ? 'Type a country\u2026' : 'Country';
      }
    }
    inMarket.addEventListener('change', () => { refreshCountryOptions(); checkAllocationWarning(); });
    inCountry.addEventListener('input', checkAllocationWarning);
    document.getElementById('inQty').addEventListener('input', checkAllocationWarning);
    refreshCountryOptions();

    /* ---------- Live allocation warning ----------
       Flags, right inside the entry form, when the market/country
       about to be submitted has already reached (or would be pushed
       past) its allocation cap. This never blocks submission — it's
       a heads-up, not a hard stop. */
    function checkAllocationWarning() {
      const warningEl = document.getElementById('allocationWarning');
      const warningText = document.getElementById('allocationWarningText');
      const marketCode = inMarket.value;
      const market = MARKETS.find(m => m.code === marketCode);
      const country = market && (market.countries.length || market.dynamicCountries) ? inCountry.value.trim() : '';
      const qty = Number(document.getElementById('inQty').value) || 0;

      const capInfo = allocationCapFor(marketCode, country);
      if (!capInfo || qty <= 0) { warningEl.classList.add('hidden'); return; }

      const currentUsed = usageFor(marketCode, country, computeUsage());
      const projected = currentUsed + qty;

      if (projected >= capInfo.cap) {
        const over = projected - capInfo.cap;
        warningText.textContent = capInfo.label + ' is already at ' + currentUsed + '/' + capInfo.cap +
          ' \u2014 this request ' + (over > 0 ? 'would exceed the limit by ' + over + ' unit' + (over === 1 ? '' : 's') : 'would reach the limit exactly') + '.';
        warningEl.classList.remove('hidden');
      } else {
        warningEl.classList.add('hidden');
      }
    }

    /* ---------- Add entry form ---------- */
    const orderForm = document.getElementById('orderForm');
    const orderFormError = document.getElementById('orderFormError');

    orderForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isEditor) {
        orderFormError.textContent = 'You have view-only access on this server and can\'t add entries.';
        return;
      }

      const dateReceived = document.getElementById('inDateReceived').value;
      const dateProcessed = document.getElementById('inDateProcessed').value;
      const caseNo = document.getElementById('inCaseNo').value.trim().slice(0, 25);
      const soldTo = document.getElementById('inSoldTo').value.trim();
      const marketCode = inMarket.value;
      const market = MARKETS.find(m => m.code === marketCode);
      const country = market && (market.countries.length || market.dynamicCountries) ? inCountry.value.trim() : '';
      const qty = Number(document.getElementById('inQty').value);
      const remarks = document.getElementById('inRemarks').value.trim();

      if (!dateReceived || !caseNo || !soldTo || !marketCode || (market && market.countries.length && !country) || !qty || qty < 1) {
        orderFormError.textContent = 'Please fill in Date Received, Case No., Sold-To Account, Market, Country and a valid Quantity.';
        return;
      }
      orderFormError.textContent = '';

      const now = demoNow();
      const newId = demoNow() + '-' + Math.random().toString(36).slice(2, 7);
      orders.push({
        id: newId,
        dateReceived, dateProcessed, caseNo, soldTo, marketCode, country, qty, remarks,
        status: 'On Process',
        segments: [],
        runningSince: null,
        runningStatus: 'On Process',
        onHold: true,
        ptimeOverride: '',
        breakdownOverride: '',
        cancelled: false
      });
      justAddedOrderId = newId;
      saveOrders();
      renderOrders();

      orderForm.reset();
      refreshCountryOptions();
      checkAllocationWarning();
      document.getElementById('inDateReceived').focus();
    });

    /* ---------- Search ---------- */
    const orderSearchInput = document.getElementById('orderSearchInput');
    const orderResultCount = document.getElementById('orderResultCount');
    orderSearchInput.addEventListener('input', () => {
      orderSearchQuery = orderSearchInput.value.trim().toLowerCase();
      renderOrders();
    });
    function matchesOrderSearch(order) {
      if (!orderSearchQuery) return true;
      const haystack = [
        order.dateReceived, order.dateProcessed, order.caseNo, order.soldTo,
        order.marketCode, order.country, order.qty, order.remarks, order.status
      ].join(' ').toLowerCase();
      return haystack.includes(orderSearchQuery);
    }

    /* ---------- Show Processing Time toggle + live ticker ---------- */
    const ptimeToggleBtn = document.getElementById('ptimeToggleBtn');
    const ptimeSwitchLabel = document.getElementById('ptimeSwitchLabel');

    function updateAllPtimeDisplays() {
      document.querySelectorAll('.js-ptime').forEach(el => {
        const order = orders.find(o => o.id === el.dataset.id);
        // A manual override is left alone — otherwise the once-a-second
        // tick would overwrite it right after it's typed in.
        if (order && !order.ptimeOverride) el.textContent = formatDuration(entryElapsedMs(order));
      });
      document.querySelectorAll('.js-breakdown').forEach(el => {
        const order = orders.find(o => o.id === el.dataset.id);
        if (order && !order.breakdownOverride) el.innerHTML = entryBreakdownHtml(order);
      });
    }
    function startPtimeTicker() { stopPtimeTicker(); ptimeInterval = setInterval(updateAllPtimeDisplays, 1000); }
    function stopPtimeTicker() { if (ptimeInterval) { clearInterval(ptimeInterval); ptimeInterval = null; } }

    function setPtimeVisible(visible) {
      showPtime = visible;
      ptimeToggleBtn.classList.toggle('on', visible);
      ptimeToggleBtn.setAttribute('aria-checked', String(visible));
      ptimeSwitchLabel.textContent = visible ? 'Processing Time on' : 'Processing Time';
      renderOrders();
      if (visible) { updateAllPtimeDisplays(); startPtimeTicker(); } else { stopPtimeTicker(); }
    }
    ptimeToggleBtn.addEventListener('click', () => setPtimeVisible(!showPtime));

    /* Mirrors the layout of GOAT_Frames_Tracker_Structure.xlsx (the
       reference template): one sheet, laid out like the page itself —
       title, allocation summary, per-market stats + country breakdown,
       then a single Order Requests table (every order, every status,
       including Waiting List and crossed-out entries) with a status-
       structure legend at the end. Two columns beyond the template's
       own header row (Processing Time, Cancelled) so nothing on the
       page is left out of the export.
       Uses xlsx-js-style (a community fork of SheetJS) instead of
       plain SheetJS specifically because the free/community build of
       SheetJS itself cannot write bold text or cell fills — this fork
       adds a `s` (style) property per cell that actually persists, so
       the section bands, table header, and status colors below render
       for real when the file is opened, not just as plain text rows. */
    /* Export / import are switched off in the demo. */
    function exportToExcel() { showDemoToast('Export is turned off in the demo'); }
    function scheduleExcelSync() { /* no spreadsheet sync in the demo */ }
    document.getElementById('exportBtn').addEventListener('click', exportToExcel);
    var demoImportBtn = document.getElementById('importBtn');
    if (demoImportBtn) demoImportBtn.addEventListener('click', function () { showDemoToast('Import is turned off in the demo'); });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    /* ---------- Delete confirmation ---------- */
    const deleteOverlay = document.getElementById('deleteOverlay');
    const deleteModalBody = document.getElementById('deleteModalBody');
    const deleteCancelBtn = document.getElementById('deleteCancelBtn');
    const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
    let pendingDeleteId = null;

    function describeOrder(order) {
      const bits = [];
      if (order.caseNo) bits.push(order.caseNo);
      if (order.soldTo) bits.push(order.soldTo);
      if (order.marketCode) bits.push(order.marketCode);
      return bits.length ? bits.join(' \u2014 ') : 'this entry';
    }

    function openDeleteModal(id) {
      pendingDeleteId = id;
      const order = orders.find(o => o.id === id);
      deleteModalBody.innerHTML = order
        ? 'You&rsquo;re about to delete <strong>' + escapeHtml(describeOrder(order)) + '</strong>. This can&rsquo;t be undone.'
        : 'This can&rsquo;t be undone once deleted.';
      deleteOverlay.classList.add('show');
      deleteConfirmBtn.focus();
    }

    function closeDeleteModal() {
      deleteOverlay.classList.remove('show');
      pendingDeleteId = null;
    }

    deleteCancelBtn.addEventListener('click', closeDeleteModal);
    deleteOverlay.addEventListener('click', (e) => {
      if (e.target === deleteOverlay) closeDeleteModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && deleteOverlay.classList.contains('show')) closeDeleteModal();
    });

    deleteConfirmBtn.addEventListener('click', () => {
      if (pendingDeleteId === null) return;
      orders = orders.filter(o => o.id !== pendingDeleteId);
      saveOrders();
      renderOrders();
      closeDeleteModal();
    });

    function editableTd(order, field, opts) {
      opts = opts || {};
      const value = order[field];
      const shown = (value === '' || value == null) ? '&mdash;' : escapeHtml(String(value));
      return '<td class="editable-cell py-2.5 pr-4 whitespace-nowrap ' + (opts.extraClass || '') + '" ' +
        'data-role="editable" data-id="' + order.id + '" data-field="' + field + '" data-type="' + (opts.type || 'text') + '" ' +
        'title="Double-click to edit">' + shown + '</td>';
    }

    function marketSelectHtml(order) {
      return '<select data-role="marketSelect" data-id="' + order.id + '" class="plain-select"' + (isEditor ? '' : ' disabled') + '>' +
        MARKETS.map(m => '<option value="' + m.code + '"' + (m.code === order.marketCode ? ' selected' : '') + '>' + m.code + '</option>').join('') +
        '</select>';
    }
    function countrySelectHtml(order) {
      const market = MARKETS.find(m => m.code === order.marketCode);
      if (!market) return '<span class="text-dim">&mdash;</span>';
      if (market.countries.length) {
        return '<select data-role="countrySelect" data-id="' + order.id + '" class="plain-select"' + (isEditor ? '' : ' disabled') + '>' +
          countryOptionsHtml(order.marketCode, order.country) +
          '</select>';
      }
      if (market.dynamicCountries) {
        // Buffer: plain free-text box, no dropdown — there's no fixed
        // country list for it, so there's nothing meaningful to suggest.
        return '<input type="text" data-role="countryInput" data-id="' + order.id + '" ' +
          'class="plain-select" placeholder="Type a country\u2026" autocomplete="off" value="' + escapeHtml(order.country || '') + '"' + (isEditor ? '' : ' disabled') + '>';
      }
      return '<span class="text-dim">&mdash;</span>';
    }
    function statusSelectHtml(order) {
      const meta = STATUS_META[order.status] || STATUS_META['On Process'];
      return '<select data-role="statusSelect" data-id="' + order.id + '" class="status-select"' + (isEditor ? '' : ' disabled') + ' ' +
        'style="background-color:' + meta.bg + ';color:' + meta.text + ';">' +
        STATUS_LIST.map(s => '<option value="' + s + '"' + (s === order.status ? ' selected' : '') + '>' + s + '</option>').join('') +
        '</select>';
    }
    function holdBtnHtml(order) {
      const disabled = !isEditor || !TRACKED_STATUSES.includes(order.status);
      return '<button type="button" data-role="holdBtn" data-id="' + order.id + '" class="hold-btn' + (order.onHold ? ' is-held' : '') + '" ' +
        'title="' + (order.onHold ? 'Resume' : 'Hold') + '"' + (disabled ? ' disabled' : '') + '>' + (order.onHold ? '\u25B6' : '\u23F8') + '</button>';
    }
    /* Waiting List only: crosses the entry out instead of deleting it —
       it stays visible (struck through, dimmed) but its quantity stops
       counting toward the dashboard's waitlisted totals and the tab's
       entry count. Click again to restore it. */
    function crossOutBtnHtml(order) {
      const active = !!order.cancelled;
      return '<button type="button" data-role="crossOutBtn" data-id="' + order.id + '" class="hold-btn cross-btn' + (active ? ' is-crossed' : '') + '"' + (isEditor ? '' : ' disabled') + ' ' +
        'title="' + (active ? 'Restore this entry' : 'Cross out (cancel without deleting)') + '">' +
        '<svg viewBox="0 0 16 16" width="10" height="10" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M4.7 4.7l6.6 6.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        '</button>';
    }
    function ptimeCellHtml(order) {
      const value = order.ptimeOverride || formatDuration(entryElapsedMs(order));
      return '<span class="js-ptime" data-id="' + order.id + '" style="font-variant-numeric: tabular-nums; font-weight: 600;">' + escapeHtml(value) + '</span>';
    }

    /* ---------- Allocation cap lookups (shared by the live form
       warning and the per-row flag) ---------- */
    function allocationCapFor(marketCode, countryCode) {
      const market = MARKETS.find(m => m.code === marketCode);
      if (!market) return null;
      if (market.splitCountries) {
        const country = market.countries.find(c => c.code === countryCode);
        return country ? { cap: country.total, label: countryCode, usedKey: marketCode + '|' + countryCode } : null;
      }
      return { cap: market.total, label: marketCode, usedKey: null };
    }
    function usageFor(marketCode, countryCode, usage) {
      const market = MARKETS.find(m => m.code === marketCode);
      if (!market) return 0;
      return market.splitCountries ? countryUsed(marketCode, countryCode, usage) : marketUsed(market, usage);
    }
    /* Only the most recently added entry for a given market/country
       gets the "Limit reached" badge — once a newer entry for that
       same country exists, the older one loses the badge even if the
       group is still over its cap, so the flag always points at the
       entry that's actually current. Unlike the dashboard (which
       flags at-or-over), this only fires once an entry has actually
       pushed the total past the cap — reaching it exactly isn't
       flagged here. */
    /* Flags every entry, in a market/country group, whose own running
       cumulative total (summing that group's quantities in the order
       they were entered, up to and including this entry) actually
       exceeds the cap — not just the newest entry. So once a group
       tips over its cap, every entry from that point on stays
       flagged, while earlier entries that still fit within the cap
       do not. Reaching the cap exactly (not exceeding it) is never
       flagged here. */
    function limitReachedNoteHtml(order) {
      if (order.status === 'Waiting List') return '';
      const capInfo = allocationCapFor(order.marketCode, order.country);
      if (!capInfo) return '';
      const market = MARKETS.find(m => m.code === order.marketCode);
      const sameGroup = orders.filter(o =>
        o.status !== 'Waiting List' &&
        o.marketCode === order.marketCode &&
        (market.splitCountries ? o.country === order.country : true)
      );
      let running = 0;
      for (const o of sameGroup) {
        running += Number(o.qty) || 0;
        if (o.id === order.id) break;
      }
      if (running <= capInfo.cap) return '';
      return '<span class="limit-badge">Limit exceeded</span>';
    }

    function orderRowHtml(order) {
      const secondBtn = order.status === 'Waiting List' ? crossOutBtnHtml(order) : holdBtnHtml(order);
      const rowClass = (order.cancelled ? 'is-cancelled ' : '') + (order.id === justAddedOrderId ? 'row-enter' : '');
      return (
        '<tr class="' + rowClass + '">' +
          editableTd(order, 'dateReceived', { type: 'date' }) +
          editableTd(order, 'dateProcessed', { type: 'date' }) +
          editableTd(order, 'caseNo', { type: 'text', extraClass: 'font-semibold text-blackish' }) +
          editableTd(order, 'soldTo', { type: 'text' }) +
          '<td class="py-2.5 pr-1">' + marketSelectHtml(order) + '</td>' +
          '<td class="py-2.5 pr-2" style="overflow: visible;">' +
            '<div class="flex items-center gap-1.5">' +
              '<div class="flex-1 min-w-0">' + countrySelectHtml(order) + '</div>' +
              limitReachedNoteHtml(order) +
            '</div>' +
          '</td>' +
          editableTd(order, 'qty', { type: 'number', extraClass: 'text-right' }) +
          '<td class="py-2.5 pr-2"><div class="flex items-center gap-1.5">' + statusSelectHtml(order) + secondBtn + '</div></td>' +
          editableTd(order, 'remarks', { type: 'text', extraClass: 'text-dim' }) +
          (showPtime ? '<td class="py-2.5 pr-2" data-role="ptimeCell" data-id="' + order.id + '" title="Double-click to override">' + ptimeCellHtml(order) + '</td>' : '') +
          (showPtime ? '<td class="py-2.5 pr-2" data-role="breakdownCell" data-id="' + order.id + '" title="Double-click to override">' + breakdownCellHtml(order) + '</td>' : '') +
          '<td class="py-2.5 text-right pr-2">' +
            '<button type="button" data-role="deleteOrder" data-id="' + order.id + '" class="entry-delete-btn focus-ring" title="Remove"' + (isEditor ? '' : ' disabled') + '>&times;</button>' +
          '</td>' +
        '</tr>'
      );
    }

    function orderColgroupHtml() {
      // Date Received, Date Processed, Case No., Sold-To Account, Market,
      // Country, Qty, Status, Remarks — sized so a real Case No. (e.g.
      // "CAS-2708551-J0G0K0") and a full Sold-To Account (e.g. "721493344
      // - OUNDA GmbH c/o Wolf Optik (76001)") both fit without truncating.
      // Market stays tight; Country is wide enough that the "Limit
      // exceeded" badge sits on the same line as the dropdown, to its
      // right, instead of wrapping underneath it.
      const widths = [100, 100, 175, 360, 68, 250, 56, 190, 180];
      if (showPtime) widths.push(112);
      if (showPtime) widths.push(190);
      widths.push(44);
      return '<colgroup>' + widths.map(w => '<col style="width:' + w + 'px;">').join('') + '</colgroup>';
    }

    function panelTableHtml(tabKey, rows) {
      const headers = ['Date Received', 'Date Processed', 'Case No.', 'Sold-To Account', 'Market', 'Country', 'Qty', 'Status', 'Remarks'];
      if (showPtime) headers.push('Processing Time');
      if (showPtime) headers.push('Break Down');
      headers.push('');

      if (!rows.length) {
        return (
          '<div class="flex flex-col items-center gap-2 py-12 text-center">' +
            '<div class="w-9 h-9 rounded-full bg-breath flex items-center justify-center text-faint">' +
              '<svg viewBox="0 0 16 16" class="w-4 h-4" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3.5" width="12" height="9.5" rx="1.3" stroke="currentColor" stroke-width="1.2"/><path d="M2 6.5h12" stroke="currentColor" stroke-width="1.2"/></svg>' +
            '</div>' +
            '<p class="text-[13px] text-faint m-0">' + (orderSearchQuery ? 'No entries match your search.' : 'No entries yet.') + '</p>' +
          '</div>'
        );
      }

      return (
        '<div class="entries-box">' +
          '<table class="order-table w-full text-left text-[13px]">' +
            orderColgroupHtml() +
            '<thead><tr class="sticky top-0 z-10 bg-dusty-rose text-[11px] font-semibold text-blackish">' +
              headers.map(h => '<th class="py-2.5 pr-2 pl-4 first:pl-4">' + h + '</th>').join('') +
            '</tr></thead>' +
            '<tbody>' + rows.map(orderRowHtml).join('') + '</tbody>' +
          '</table>' +
        '</div>'
      );
    }

    function renderOrders() {
      const filtered = orders.filter(matchesOrderSearch);
      Object.keys(TAB_STATUSES).forEach(tabKey => {
        const panelEl = document.getElementById('panel-' + tabKey);
        // Rebuilding the panel's innerHTML below replaces the scrollable
        // .entries-box with a brand-new element, which would otherwise
        // silently reset its scroll position back to the top on every
        // single change (e.g. clicking Hold on one row) — capture it
        // first and restore it after.
        const oldBox = panelEl.querySelector('.entries-box');
        const scrollTop = oldBox ? oldBox.scrollTop : 0;
        const scrollLeft = oldBox ? oldBox.scrollLeft : 0;

        const rows = filtered.filter(o => TAB_STATUSES[tabKey].includes(o.status));
        panelEl.innerHTML = panelTableHtml(tabKey, rows);

        const newBox = panelEl.querySelector('.entries-box');
        if (newBox) { newBox.scrollTop = scrollTop; newBox.scrollLeft = scrollLeft; }

        const countEl = document.querySelector('[data-tab-count="' + tabKey + '"]');
        // Crossed-out entries stay visible in the Waiting List tab (rows
        // above still includes them) but don't count toward the tab's
        // number — this is a count of entries, never quantity.
        if (countEl) countEl.textContent = String(rows.filter(o => !o.cancelled).length);
      });
      justAddedOrderId = null;

      orderResultCount.textContent = orderSearchQuery
        ? filtered.length + ' of ' + orders.length + ' entries'
        : orders.length + (orders.length === 1 ? ' entry' : ' entries');

      /* ---- generic double-click-to-edit for plain cells ---- */
      document.querySelectorAll('[data-role="editable"]').forEach(cell => {
        cell.addEventListener('dblclick', () => {
          if (!isEditor) return;
          const order = orders.find(o => o.id === cell.dataset.id);
          if (!order) return;
          const field = cell.dataset.field;
          const type = cell.dataset.type;
          const originalValue = order[field] ?? '';
          cell.innerHTML = '<input type="' + type + '" class="cell-edit-input">';
          const input = cell.querySelector('.cell-edit-input');
          input.value = originalValue;
          input.focus();
          if (type === 'text') input.select();

          function commit() {
            let newValue = input.value;
            if (type === 'number') newValue = newValue === '' ? '' : Number(newValue);
            order[field] = newValue;
            saveOrders();
            renderOrders();
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = originalValue; input.blur(); }
          });
        });
      });

      document.querySelectorAll('[data-role="marketSelect"]').forEach(sel => {
        sel.addEventListener('change', () => {
          const order = orders.find(o => o.id === sel.dataset.id);
          if (!order) return;
          order.marketCode = sel.value;
          const market = MARKETS.find(m => m.code === sel.value);
          order.country = market && market.countries.length ? market.countries[0].code : '';
          saveOrders();
          renderOrders();
        });
      });

      document.querySelectorAll('[data-role="countrySelect"]').forEach(sel => {
        sel.addEventListener('change', () => {
          const order = orders.find(o => o.id === sel.dataset.id);
          if (!order) return;
          order.country = sel.value;
          saveOrders();
          renderOrders();
        });
      });

      // Buffer's free-text country combobox (see countrySelectHtml).
      document.querySelectorAll('[data-role="countryInput"]').forEach(input => {
        input.addEventListener('change', () => {
          const order = orders.find(o => o.id === input.dataset.id);
          if (!order) return;
          order.country = input.value.trim();
          saveOrders();
          renderOrders();
        });
      });

      document.querySelectorAll('[data-role="statusSelect"]').forEach(sel => {
        sel.addEventListener('change', () => {
          const order = orders.find(o => o.id === sel.dataset.id);
          if (!order) return;
          const now = demoNow();
          closeRunningSegment(order, now);
          order.status = sel.value;
          if (sel.value !== 'Waiting List') order.cancelled = false;
          if (TRACKED_STATUSES.includes(sel.value) && !order.onHold) {
            order.runningSince = now;
            order.runningStatus = sel.value;
          } else {
            order.onHold = false;
          }
          order.ptimeOverride = '';
          saveOrders();
          renderOrders();
        });
      });

      document.querySelectorAll('[data-role="holdBtn"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const order = orders.find(o => o.id === btn.dataset.id);
          if (!order || !TRACKED_STATUSES.includes(order.status)) return;
          const now = demoNow();
          if (order.onHold) {
            order.onHold = false;
            order.runningSince = now;
            order.runningStatus = order.status;
          } else {
            closeRunningSegment(order, now);
            order.onHold = true;
          }
          saveOrders();
          renderOrders();
        });
      });

      document.querySelectorAll('[data-role="crossOutBtn"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const order = orders.find(o => o.id === btn.dataset.id);
          if (!order) return;
          order.cancelled = !order.cancelled;
          saveOrders();
          renderOrders();
        });
      });

      document.querySelectorAll('[data-role="ptimeCell"]').forEach(cell => {
        cell.addEventListener('dblclick', () => {
          if (!isEditor) return;
          const order = orders.find(o => o.id === cell.dataset.id);
          if (!order) return;
          const originalValue = order.ptimeOverride || formatDuration(entryElapsedMs(order));
          cell.innerHTML = '<input type="text" class="cell-edit-input" placeholder="Xd HH:MM:SS">';
          const input = cell.querySelector('.cell-edit-input');
          input.value = originalValue;
          input.focus();
          input.select();
          function commit() {
            order.ptimeOverride = input.value;
            saveOrders();
            renderOrders();
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = originalValue; input.blur(); }
          });
        });
      });

      document.querySelectorAll('[data-role="breakdownCell"]').forEach(cell => {
        cell.addEventListener('dblclick', () => {
          if (!isEditor) return;
          const order = orders.find(o => o.id === cell.dataset.id);
          if (!order) return;
          const originalValue = order.breakdownOverride || entryBreakdownEditText(order);
          cell.innerHTML = '<textarea class="cell-edit-textarea" placeholder="Jul 17\nOn Process 1:20:00"></textarea>';
          const input = cell.querySelector('.cell-edit-textarea');
          input.value = originalValue;
          input.focus();
          input.select();
          function commit() {
            order.breakdownOverride = input.value;
            // A hand-edited Break Down carries enough ("Label HH:MM:SS"
            // part lines) to recompute Processing Time automatically, so
            // typing the Break Down alone is enough — Processing Time
            // stays separately double-click-editable too, for anyone who
            // wants to set it by hand instead.
            const autoMs = parseBreakdownDurationMs(order.breakdownOverride);
            if (autoMs != null) order.ptimeOverride = formatDuration(autoMs);
            saveOrders();
            renderOrders();
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { input.value = originalValue; input.blur(); }
          });
        });
      });

      document.querySelectorAll('[data-role="deleteOrder"]').forEach(btn => {
        btn.addEventListener('click', () => {
          openDeleteModal(btn.dataset.id);
        });
      });

      if (showPtime) updateAllPtimeDisplays();
      render();
    }

    /* Initial load: pull the shared JSON and this device's permissions
       from the Backoffice server (or local fallbacks if it isn't
       reachable) in parallel, apply what they mean for the UI, then
       render once everything's actually in hand. */
    (async () => {
      const [ordersData, who] = await Promise.all([loadOrders(), fetchWhoAmI()]);
      orders = ordersData;
      isEditor = who.isEditor;
      canExtract = who.canExtract;

      const exportBtn = document.getElementById('exportBtn');
      if (exportBtn) exportBtn.classList.toggle('hidden', !canExtract);

      // Import writes new data, so — like the other task pages' shared
      // shared access rules — it only shows when the viewer is BOTH an
      // editor and has extraction enabled; Export just needs extraction.
      const importBtn = document.getElementById('importBtn');
      if (importBtn) importBtn.classList.toggle('hidden', !(isEditor && canExtract));

      if (!isEditor) {
        // Matches the shared access rules on
        // the other pages: viewers don't get a disabled-looking input
        // row, the whole "New Order Request" panel is hidden — there's
        // nothing for them to fill in there.
        const newOrderSection = document.getElementById('newOrderSection');
        if (newOrderSection) newOrderSection.classList.add('hidden');
        setFormEditable(false);
        setServerStatus('View-only access \u2014 you can browse, but changes here won\'t be saved.', true);

        // Processing Time / Break Down are editor-only detail (matches
        // The shared access rules hide them entirely
        // for viewers on the other pages) — viewers never get the toggle,
        // not just an off-by-default one.
        if (ptimeToggleBtn) ptimeToggleBtn.classList.add('hidden');
        showPtime = false;
      }

      renderOrders();

      // Demo data snapshot: every saved case is Completed, so open the tab
      // that actually holds the rows instead of an empty Pending view.
      var demoPending = document.querySelectorAll('#panel-pending tbody tr').length;
      var demoCompleted = document.querySelectorAll('#panel-completed tbody tr').length;
      if (!demoPending && demoCompleted) {
        var demoCompletedTab = document.getElementById('tab-completed');
        if (demoCompletedTab) demoCompletedTab.click();
      }
    })();
  </script>


</body>
</html>
