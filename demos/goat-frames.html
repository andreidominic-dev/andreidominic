<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Edition &mdash; GOAT Frames | Backoffice</title>
<style>
  /* A few things Tailwind utilities can't express cleanly on their own. */
  .tint-wheat   { background: rgba(184, 146, 106, 0.14); }
  .tint-caution { background: rgba(192, 138, 62, 0.12); }
  .tint-urgent  { background: rgba(184, 92, 74, 0.10); }

  /* ============================================================
     Order Requests — styling adopted from Manual Typing (entry
     line, search pill, process-time switch, status pills, hold /
     delete buttons, double-click-to-edit cells), restyled onto
     this page's own Caramel Coated palette.
     ============================================================ */

  /* ---------- One-line Add Entry form ---------- */
  .entry-line {
    display: flex;
    align-items: flex-end;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: #B0B0B0 transparent;
  }
  .entry-line::-webkit-scrollbar { height: 6px; }
  .entry-line::-webkit-scrollbar-track { background: transparent; }
  .entry-line::-webkit-scrollbar-thumb { background: #B0B0B0; border-radius: 4px; }
  .entry-line::-webkit-scrollbar-thumb:hover { background: #B8926A; }

  /* Thin hairline between logical field clusters (dates / identifiers
     / market+country / qty+remarks) so the compact row reads as
     organized groups instead of one undifferentiated strip. */
  .entry-divider { width: 1px; align-self: stretch; margin: 2px 3px 6px; background: #E4DFD8; flex-shrink: 0; }

  .field-input {
    border: 1px solid #C7C2BA;
    background: #FCFBF9;
    border-radius: 6px;
    padding: 6px 9px;
    font: inherit;
    font-size: 12.5px;
    color: #2D2D2B;
    outline: none;
    box-shadow: inset 0 1px 1px rgba(45, 45, 43, 0.03);
    transition: border-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .field-input:hover { border-color: #B8926A; }
  .field-input::placeholder { color: #ADA391; }
  .field-input:focus { background: #FFFFFF; border-color: #B8926A; box-shadow: 0 0 0 3px rgba(184, 146, 106, 0.16); }
  .field-input:disabled { opacity: 0.55; cursor: not-allowed; }

  .commit-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    background: #2D2D2B;
    color: #FFFFFF;
    border: 1px solid #2D2D2B;
    border-radius: 6px;
    padding: 7px 16px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(45, 45, 43, 0.18), 0 3px 8px rgba(45, 45, 43, 0.1);
    transition: background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), border-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .commit-btn svg { transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .commit-btn:hover { background: #92714F; border-color: #92714F; box-shadow: 0 2px 5px rgba(146, 113, 79, 0.3), 0 5px 14px rgba(146, 113, 79, 0.22); transform: translateY(-1px); }
  .commit-btn:hover svg { transform: rotate(90deg); }
  .commit-btn:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(45, 45, 43, 0.2); }
  .commit-btn:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }

  /* ---------- Search field (pill) ---------- */
  .search-field { position: relative; flex: 1; max-width: 320px; }
  .search-field svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #8B8B87; pointer-events: none; }
  .search-field input {
    width: 100%;
    border: 1px solid #B0B0B0;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 9px 14px 9px 34px;
    font: inherit;
    font-size: 13px;
    color: #2D2D2B;
    outline: none;
    transition: border-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .search-field input:focus { border-color: #B8926A; box-shadow: 0 0 0 3px rgba(184, 146, 106, 0.14); }
  .result-count { font-size: 12px; color: #8B8B87; white-space: nowrap; }

  /* ---------- Show Processing Time switch (icon + track + thumb) ---------- */
  .ptime-switch {
    display: inline-flex; align-items: center; gap: 9px;
    background: #FFFFFF; border: 1px solid #B0B0B0; border-radius: 24px;
    padding: 5px 14px 5px 6px; cursor: pointer; font: inherit; color: #8B8B87;
    transition: border-color 0.2s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .ptime-switch:hover { border-color: #B8926A; }
  .ptime-switch-icon { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; flex-shrink: 0; }
  .ptime-switch-icon svg { width: 15px; height: 15px; }
  .ptime-switch-icon svg circle, .ptime-switch-icon svg path { stroke: #8B8B87; transition: stroke 0.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .ptime-switch-icon .clock-hand { transform-origin: 8px 8px; }
  .ptime-switch-track { position: relative; width: 34px; height: 19px; border-radius: 10px; background: #B0B0B0; flex-shrink: 0; transition: background 0.25s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .ptime-switch-thumb { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(45,45,43,0.35); transition: transform 0.25s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .ptime-switch-label { font-size: 12.5px; font-weight: 600; color: #8B8B87; white-space: nowrap; transition: color 0.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .ptime-switch.on { border-color: #B8926A; }
  .ptime-switch.on .ptime-switch-track { background: #B8926A; }
  .ptime-switch.on .ptime-switch-thumb { transform: translateX(15px); }
  .ptime-switch.on .ptime-switch-label { color: #2D2D2B; }
  .ptime-switch.on .ptime-switch-icon svg circle, .ptime-switch.on .ptime-switch-icon svg path { stroke: #B8926A; }
  .ptime-switch.on .ptime-switch-icon .clock-hand { animation: clockTick 2.2s linear infinite; }
  @keyframes clockTick { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ---------- Table rows ---------- */
  /* ---------- Order Requests table (styled after the Follow Up page) ---------- */
  .entries-box {
    border: 1px solid #B0B0B0;
    border-radius: 8px;
    overflow: auto;
    max-height: 460px;
    box-shadow: 0 1px 2px rgba(45, 45, 43, 0.05), 0 4px 14px rgba(45, 45, 43, 0.05);
  }
  /* Fixed layout: every column keeps the width its <col> gives it,
     regardless of what gets typed into an editable cell — long text
     truncates with an ellipsis (title attribute carries the full
     value) instead of stretching the table or breaking the grid. */
  .order-table { table-layout: fixed; }
  .order-table td, .order-table th {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .order-table td.cell-remarks, .order-table th.col-remarks { white-space: nowrap; }

  /* ---------- Allocation warning ---------- */
  .alloc-warning {
    display: flex; align-items: center; gap: 8px;
    background: rgba(161, 76, 76, 0.1); border: 1px solid rgba(161, 76, 76, 0.35);
    color: #A14C4C; border-radius: 6px; padding: 8px 12px;
    font-size: 12px; line-height: 1.4; font-weight: 600;
  }
  /* "Limit reached" pill — used in the order table (next to Market,
     only when an entry actually pushes a country/market past its cap)
     and in the allocation dashboard (next to a market or country name,
     once usage is at or over its cap). */
  .limit-badge {
    display: inline-flex; align-items: center;
    background: rgba(161, 76, 76, 0.12);
    color: #A14C4C;
    font-size: 10.5px; font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  /* Tallies queued-up demand (Waiting List entries) separately from
     the "Limit reached" badge above — same color family since both
     relate to the Waiting List status, but lighter so the two never
     get confused for one another. */
  .waitlist-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: rgba(161, 76, 76, 0.08);
    color: #A14C4C;
    font-size: 10px; font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  /* Only a genuinely new row animates in — every other row simply
     re-renders in place. Previously every row replayed this on any
     change anywhere in the table (e.g. clicking Hold on one entry
     made the whole table look like it had just reloaded). */
  .order-panel tbody tr.row-enter { animation: rowIn 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  .order-panel tbody tr:nth-child(even) { background: rgba(212, 200, 190, 0.32); }
  .order-panel tbody tr:hover { background: rgba(184, 146, 106, 0.14); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- View tabs (segmented pill, adopted from Follow Up) ---------- */
  .view-tabs {
    display: inline-flex; align-items: center; gap: 3px;
    background: rgba(176, 176, 176, 0.16); border: 1px solid #B0B0B0;
    border-radius: 24px; padding: 3px;
  }
  .view-tab {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: none; color: #8B8B87;
    font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
    transition: background 0.2s cubic-bezier(0.2, 0.7, 0.3, 1), color 0.2s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.2s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .view-tab:hover { color: #2D2D2B; }
  .view-tab:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }
  .view-tab.active { background: #FFFFFF; color: #2D2D2B; box-shadow: 0 1px 2px rgba(45, 45, 43, 0.05), 0 4px 14px rgba(45, 45, 43, 0.05); }
  .view-tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .view-tab[data-tab="pending"] .tab-dot { background: #B8926A; }
  .view-tab[data-tab="completed"] .tab-dot { background: #C3D3BC; border: 1px solid #9db496; }
  .view-tab[data-tab="waiting"] .tab-dot { background: #A14C4C; }
  .tab-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    background: rgba(45, 45, 43, 0.12); color: #8B8B87; font-size: 11px; font-weight: 700;
    transition: background 0.2s cubic-bezier(0.2, 0.7, 0.3, 1), color 0.2s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .view-tab[data-tab="pending"].active .tab-count { background: #B8926A; color: #fff; }
  .view-tab[data-tab="completed"].active .tab-count { background: #C3D3BC; color: #2D2D2B; }
  .view-tab[data-tab="waiting"].active .tab-count { background: #A14C4C; color: #fff; }

  /* Directly editable plain cells: text cursor + soft hover highlight,
     same discoverability cue as Manual Typing. */
  .editable-cell { cursor: text; padding: 3px 5px; margin: -3px -5px; border-radius: 4px; transition: background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .editable-cell:hover { background: rgba(184, 146, 106, 0.10); }
  .cell-edit-input {
    width: 100%; border: none; border-bottom: 1px solid #B8926A; background: transparent;
    padding: 2px 0; font: inherit; font-size: 13px; color: #2D2D2B; outline: none; text-align: inherit;
  }
  .cell-edit-textarea {
    width: 100%; min-height: 60px; border: 1px solid #B8926A; border-radius: 4px;
    background: #FFFFFF; padding: 5px 7px; font: inherit; font-size: 11.5px; line-height: 1.5;
    color: #2D2D2B; outline: none; resize: vertical;
  }
  .bd-date { font-weight: 700; color: #2D2D2B; }
  .bd-part { padding-left: 6px; color: #8B8B87; white-space: nowrap; }
  .bd-empty { color: #8B8B87; }

  /* Plain, always-clickable dropdowns (Market / Country) — no visible
     border until hovered, reads as editable without looking like a form. */
  .plain-select {
    appearance: none; -webkit-appearance: none; border: none; background: transparent;
    font: inherit; font-size: 13px; color: #8B8B87; cursor: pointer;
    padding: 3px 18px 3px 4px; border-radius: 4px; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M0 0 L4.5 6 L9 0 Z' fill='%238B8B87'/></svg>");
    background-repeat: no-repeat; background-position: right 2px center;
    transition: background-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .plain-select:hover { background-color: rgba(184, 146, 106, 0.10); }
  .plain-select:focus-visible { outline: 2px solid #B8926A; outline-offset: 1px; }

  /* ---------- Status pill select ---------- */
  .status-select {
    appearance: none; -webkit-appearance: none; border: none; border-radius: 20px;
    padding: 4px 22px 4px 10px; font: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em; cursor: pointer; outline: none;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M0 0 L4.5 6 L9 0 Z' fill='%232D2D2B' fill-opacity='0.55'/></svg>");
    background-repeat: no-repeat; background-position: right 7px center;
    transition: box-shadow 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .status-select:hover { box-shadow: 0 0 0 2px rgba(45, 45, 43, 0.1); }
  .status-select:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }
  .status-select option { background: #FFFFFF; color: #2D2D2B; }

  /* ---------- Hold (pause/resume) button — sits beside Status ---------- */
  .hold-btn {
    flex: 0 0 auto; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid #B0B0B0; background: #FFFFFF; color: #8B8B87;
    font-size: 10px; line-height: 1; cursor: pointer; padding: 0;
    transition: border-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .hold-btn:hover:not(:disabled) { border-color: #B8926A; color: #2D2D2B; }
  .hold-btn:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }
  .hold-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hold-btn.is-held { background: #D4C8BE; border-color: #D4C8BE; color: #2D2D2B; }

  /* ---------- Cross-out (cancel without deleting) — Waiting List only ---------- */
  .cross-btn.is-crossed { background: #A14C4C; border-color: #A14C4C; color: #FFFFFF; }
  .order-panel tbody tr.is-cancelled { opacity: 0.5; }
  .order-panel tbody tr.is-cancelled td { text-decoration: line-through; }

  /* ---------- Delete button ---------- */
  .entry-delete-btn {
    display: flex; align-items: center; justify-content: center; width: 26px; height: 26px;
    background: transparent; border: none; color: #8B8B87; font-size: 16px; cursor: pointer;
    font-family: inherit; border-radius: 4px;
    transition: background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .entry-delete-btn:hover { color: #2D2D2B; background: #D4C8BE; transform: scale(1.08); }
  .entry-delete-btn:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }
  .entry-delete-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .entry-delete-btn:disabled:hover { background: transparent; transform: none; }
  .plain-select:disabled, .status-select:disabled { opacity: 0.6; cursor: not-allowed; }
  .plain-select:disabled:hover { background-color: transparent; }

  /* Country breakdown opens as a floating card over the page instead
     of stretching the market card's height — so expanding one never
     shoves the sections below it (the Order Requests tabs) down. */
  .country-panel {
    top: calc(100% + 8px);
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .country-panel.is-open { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .chevron { transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .chevron.is-open { transform: rotate(180deg); }

  .focus-ring:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }

  /* ---------- Delete confirmation modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(45, 45, 43, 0.42);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.18s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: #FFFFFF; border-radius: 10px; padding: 26px 26px 22px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 8px 30px rgba(45, 45, 43, 0.25);
    transform: translateY(10px) scale(0.97); opacity: 0;
    transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.2s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .modal-overlay.show .modal-card { transform: translateY(0) scale(1); opacity: 1; }
  .modal-icon {
    width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
    background: rgba(161, 76, 76, 0.12); display: flex; align-items: center; justify-content: center;
  }
  .modal-icon svg { width: 22px; height: 22px; }
  .modal-icon svg path, .modal-icon svg circle { stroke: #A14C4C; }
  .modal-title { font-size: 16px; font-weight: 700; color: #2D2D2B; margin: 0 0 8px; }
  .modal-body { font-size: 13px; line-height: 1.5; color: #8B8B87; margin: 0 0 22px; }
  .modal-body strong { color: #2D2D2B; font-weight: 600; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 11px; font: inherit; font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;
    border-radius: 5px; cursor: pointer;
    transition: background 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), border-color 0.15s cubic-bezier(0.2, 0.7, 0.3, 1), transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .modal-btn:active { transform: translateY(1px); }
  .modal-btn:focus-visible { outline: 2px solid #B8926A; outline-offset: 2px; }
  .modal-btn-cancel { background: transparent; color: #2D2D2B; border: 1px solid #C7C2BA; }
  .modal-btn-cancel:hover { border-color: #B8926A; background: rgba(184, 146, 106, 0.1); }
  .modal-btn-danger { background: #A14C4C; color: #fff; border: 1px solid #A14C4C; }
  .modal-btn-danger:hover { background: #8A3F3F; border-color: #8A3F3F; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<body class="min-h-screen m-0 flex flex-col bg-breath text-blackish font-sans">

  <header class="flex flex-wrap items-center gap-4 px-8 py-3.5 bg-white border-b border-wind">
    <a href="home.html"
       class="focus-ring inline-flex items-center gap-2 border border-wind text-dim text-[13px] tracking-wide rounded-md px-4 py-2 no-underline transition-colors duration-150 hover:border-wheat hover:text-blackish hover:tint-wheat">
      <svg viewBox="0 0 16 16" class="w-3.5 h-3.5" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.5 3L5 8l4.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
    <h1 class="text-[18px] sm:text-[24px] font-bold tracking-[0.3em] sm:tracking-[0.45em] indent-[0.3em] sm:indent-[0.45em] whitespace-nowrap m-0 text-blackish">SPECIAL EDITION &mdash; GOAT FRAMES</h1>
  </header>

  <main class="flex-1 w-full max-w-[1680px] mx-auto px-6 py-3 flex flex-col gap-3">

    <!-- ===== Allocation dashboard ===== -->
    <section aria-labelledby="allocHeading">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <h2 id="allocHeading" class="text-[11px] font-semibold uppercase tracking-[0.14em] text-dim m-0">
          Model 171039 &mdash; Allocation
        </h2>
        <span class="text-[10px] text-faint">Updated live from Order Requests</span>
      </div>

      <!-- Total + Buffer, side by side on the same 4-column grid as the
           market cards below, so Total Allocation (3 cols) lines up
           flush with APAC/CC/EU and Buffer (1 col) lines up flush with
           NAM. items-stretch keeps Buffer the same height as Total. -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mb-2 items-stretch">
        <div class="sm:col-span-2 lg:col-span-3 bg-white border border-wind rounded-lg px-3.5 py-2.5 flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="shrink-0 sm:w-[190px]">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[9.5px] font-semibold uppercase tracking-[0.1em] text-wheat-deep">Total Allocation</span>
              <span id="grandPctLabel" class="text-[10.5px] font-semibold text-blackish tabular-nums"></span>
            </div>
            <div class="flex items-baseline gap-1.5 mt-0.5">
              <span id="grandTotalLabel" class="text-[22px] font-semibold leading-none text-blackish tabular-nums">350</span>
              <span class="text-[10.5px] text-dim">units available</span>
            </div>
          </div>
          <div class="flex-1 w-full sm:border-l sm:border-breath sm:pl-4">
            <div class="flex items-center justify-between text-[10.5px] text-dim mb-1 tabular-nums">
              <span id="grandUsedLabel"></span>
              <span id="grandRemainingLabel" class="font-semibold text-wheat-deep"></span>
            </div>
            <!-- Segmented: base usage (wheat) then, stacked right after it,
                 however much of that usage came from Buffer (wheat-deep) —
                 so the composition of "used" is visible at a glance. -->
            <div class="h-[7px] rounded-full bg-breath overflow-hidden flex">
              <div id="grandBarBase" class="h-full bg-wheat transition-[width] duration-300" style="width: 0%;"></div>
              <div id="grandBarBuffer" class="h-full transition-[width] duration-300" style="width: 0%; background:#4C8C52;"></div>
            </div>
            <div class="flex items-center justify-between gap-2 mt-1">
              <p class="text-[10px] text-faint m-0">Live utilization across all tracked markets</p>
              <span id="grandBufferUsedLabel" class="text-[10px] font-semibold whitespace-nowrap tabular-nums" style="color:#4C8C52;"></span>
            </div>
          </div>
        </div>

        <div id="bufferCard"></div>
      </div>

      <!-- Market cards — a full row of their own, so each one has room for its country breakdown.
           items-stretch keeps every card the same height regardless of
           whether it has a waitlisted badge — the card doesn't resize
           when one appears, it just shows the number inline. -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 items-stretch">
        <div id="marketCards" class="contents"></div>
      </div>
    </section>


    <!-- ===== New Order Request (input) — kept separate from the saved
         entries below, styled as a compact one-line quick-entry row
         (adopted from Manual Typing). ===== -->
    <section id="newOrderSection" aria-labelledby="newOrderHeading" class="bg-white border border-wind rounded-[10px] p-3 flex flex-col gap-2.5" style="box-shadow: 0 1px 2px rgba(45,45,43,0.04), 0 3px 10px rgba(45,45,43,0.04);">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 shrink-0 rounded-md flex items-center justify-center text-white" style="background: linear-gradient(135deg, #B8926A, #92714F); box-shadow: 0 2px 5px rgba(146,113,79,0.4), inset 0 1px 0 rgba(255,255,255,0.25);">
          <svg viewBox="0 0 16 16" class="w-3 h-3" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h2 id="newOrderHeading" class="text-[13px] font-bold text-blackish m-0">New Order Request</h2>
        <span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide text-wheat-deep bg-[rgba(184,146,106,0.12)] rounded-full px-2 py-0.5">Logs as On Process</span>
      </div>

      <form id="orderForm" class="entry-line">
        <div class="flex flex-col gap-1 shrink-0" style="width:112px;">
          <label for="inDateReceived" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Date Received</label>
          <input type="date" id="inDateReceived" required class="field-input">
        </div>
        <div class="flex flex-col gap-1 shrink-0" style="width:112px;">
          <label for="inDateProcessed" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Date Processed</label>
          <input type="date" id="inDateProcessed" class="field-input">
        </div>

        <div class="entry-divider"></div>

        <div class="flex flex-col gap-1 shrink-0">
          <label for="inCaseNo" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Case No. <span class="text-faint normal-case font-normal">(25 max)</span></label>
          <input type="text" id="inCaseNo" required maxlength="25" placeholder="e.g. CS-10234" class="field-input" style="width: 25ch;">
        </div>
        <div class="flex flex-col gap-1 shrink-0" style="width:260px;">
          <label for="inSoldTo" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Sold-To Account</label>
          <input type="text" id="inSoldTo" required placeholder="Account name / no." class="field-input">
        </div>

        <div class="entry-divider"></div>

        <div class="flex flex-col gap-1 shrink-0" style="width:90px;">
          <label for="inMarket" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Market</label>
          <select id="inMarket" required class="field-input"></select>
        </div>
        <div class="flex flex-col gap-1 shrink-0" style="width:190px;">
          <label for="inCountry" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Country</label>
          <input type="text" id="inCountry" list="inCountryList" autocomplete="off" placeholder="Country" class="field-input">
          <datalist id="inCountryList"></datalist>
        </div>

        <div class="entry-divider"></div>

        <div class="flex flex-col gap-1 shrink-0" style="width:66px;">
          <label for="inQty" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Quantity</label>
          <input type="number" id="inQty" required min="1" step="1" placeholder="0" class="field-input">
        </div>
        <div class="flex flex-col gap-1 flex-1" style="min-width:180px;">
          <label for="inRemarks" class="text-[10px] font-semibold uppercase tracking-wide text-dim">Remarks</label>
          <input type="text" id="inRemarks" placeholder="Optional notes&hellip;" class="field-input">
        </div>

        <button type="submit" id="orderSubmitBtn" class="commit-btn shrink-0">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"><path d="M8 3.5v9M3.5 8h9" stroke-width="1.6" stroke-linecap="round"/></svg>
          Add
        </button>
      </form>
      <p id="orderFormError" class="text-[12px] text-urgent m-0"></p>
      <div id="allocationWarning" class="alloc-warning hidden">
        <span id="allocationWarningText"></span>
      </div>
    </section>


    <!-- ===== Order Requests (saved entries) ===== -->
    <section aria-labelledby="ordersHeading" class="bg-white border border-wind rounded-[10px] p-3 flex flex-col gap-2.5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="ordersHeading" class="text-[15px] font-bold text-blackish m-0">Order Requests</h2>

        <div class="flex items-center gap-4 flex-wrap">
          <div class="search-field">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input type="text" id="orderSearchInput" placeholder="Search all columns&hellip;">
          </div>
          <span id="orderResultCount" class="result-count"></span>

          <span id="serverStatus" class="text-[11px] text-faint whitespace-nowrap"></span>

          <button type="button" id="ptimeToggleBtn" role="switch" aria-checked="false" class="ptime-switch focus-ring">
            <span class="ptime-switch-icon">
              <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.3" stroke-width="1.3"/><path class="clock-hand" d="M8 4.7V8l2.6 1.6" stroke-width="1.3" stroke-linecap="round"/></svg>
            </span>
            <span class="ptime-switch-track"><span class="ptime-switch-thumb"></span></span>
            <span class="ptime-switch-label" id="ptimeSwitchLabel">Processing Time</span>
          </button>

          <input type="file" id="importFileInput" accept=".xlsx" class="hidden">
          <button type="button" id="importBtn" title="Import order requests from an exported .xlsx file"
            class="hidden focus-ring inline-flex items-center gap-1.5 border border-wind rounded-md px-2.5 py-1.5 text-[11.5px] font-semibold text-dim bg-transparent hover:text-blackish hover:border-wheat hover:tint-wheat transition-colors duration-150">
            <svg viewBox="0 0 16 16" class="w-3.5 h-3.5" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5V3M8 3 5.2 5.8M8 3l2.8 2.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.5v1.3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Import
          </button>

          <button type="button" id="exportBtn" title="Export all order requests to Excel"
            class="hidden focus-ring inline-flex items-center gap-1.5 border border-wind rounded-md px-2.5 py-1.5 text-[11.5px] font-semibold text-dim bg-transparent hover:text-blackish hover:border-wheat hover:tint-wheat transition-colors duration-150">
            <svg viewBox="0 0 16 16" class="w-3.5 h-3.5" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2v7.5M8 9.5 5.2 6.7M8 9.5l2.8-2.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.5v1.3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Export
          </button>
        </div>
      </div>

      <!-- Tabs (segmented pill, same design as the Follow Up page) -->
      <div class="view-tabs" role="tablist" aria-label="Order request status">
        <button type="button" class="view-tab active" data-tab="pending" id="tab-pending" role="tab" aria-selected="true" aria-controls="panel-pending">
          <span class="tab-dot"></span>Pending Request<span class="tab-count" data-tab-count="pending">0</span>
        </button>
        <button type="button" class="view-tab" data-tab="completed" id="tab-completed" role="tab" aria-selected="false" aria-controls="panel-completed">
          <span class="tab-dot"></span>Completed<span class="tab-count" data-tab-count="completed">0</span>
        </button>
        <button type="button" class="view-tab" data-tab="waiting" id="tab-waiting" role="tab" aria-selected="false" aria-controls="panel-waiting">
          <span class="tab-dot"></span>Waiting List<span class="tab-count" data-tab-count="waiting">0</span>
        </button>
      </div>

      <div id="panel-pending" role="tabpanel" aria-labelledby="tab-pending" class="order-panel"></div>
      <div id="panel-completed" role="tabpanel" aria-labelledby="tab-completed" class="order-panel hidden"></div>
      <div id="panel-waiting" role="tabpanel" aria-labelledby="tab-waiting" class="order-panel hidden"></div>
    </section>

  </main>

  <div id="demoToast" role="status" aria-live="polite"></div>

  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalBody">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 8.5V13" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="16.2" r="0.9" fill="#A14C4C" stroke="none"/>
          <path d="M10.6 3.6c.6-1 2.2-1 2.8 0l8 13.6c.6 1-.15 2.3-1.4 2.3H4c-1.25 0-2-1.3-1.4-2.3l8-13.6z" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="modal-title" id="deleteModalTitle">Delete this order request?</h2>
      <p class="modal-body" id="deleteModalBody">This can&rsquo;t be undone once deleted.</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-cancel" id="deleteCancelBtn">Cancel</button>
        <button type="button" class="modal-btn modal-btn-danger" id="deleteConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   Demo build: frozen snapshot clock, inlined read-only data,
   in-memory only state. No network, no storage.
   ============================================================ */

/* Blur people, accounts and case numbers on screen. The values stay in the
   markup for layout, they are only visually masked. */
function applyDemoPii() {
  var names = [];
  DEMO_ORDERS.forEach(function (o) {
    var v = o && o.soldTo ? String(o.soldTo).trim() : '';
    if (v.length > 2 && names.indexOf(v) === -1) names.push(v);
  });
  names.sort(function (a, b) { return b.length - a.length; });
  var BS = String.fromCharCode(92);
  var SPECIAL = '.*+?^$()[]|{}' + BS;
  function escapeRe(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) { out += SPECIAL.indexOf(str[i]) >= 0 ? BS + str[i] : str[i]; }
    return out;
  }
  var parts = names.map(escapeRe);
  parts.push('CAS-[A-Z0-9-]+');
  parts.push('[A-Z]{1,2}[0-9]{7,}');
  var re = new RegExp('(' + parts.join('|') + ')', 'g');
  var roots = [document.querySelector('main'), document.getElementById('deleteOverlay')];
  var nodes = [];
  roots.forEach(function (root) {
    if (!root || !root.querySelectorAll) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var pe = n.parentElement;
        if (pe && (pe.closest('.pii') || pe.closest('script') || pe.closest('style'))) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var n; while ((n = walker.nextNode())) nodes.push(n);
  });
  nodes.forEach(function (n) {
    var text = n.nodeValue;
    re.lastIndex = 0;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    var frag = document.createDocumentFragment();
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var span = document.createElement('span');
      span.className = 'pii';
      span.textContent = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}

function scheduleDemoPii() {
  if (__piiQueue) return;
  __piiQueue = setTimeout(function () { __piiQueue = null; try { applyDemoPii(); } catch (e) {} }, 120);
}
window.addEventListener('load', scheduleDemoPii);
setTimeout(scheduleDemoPii, 400);

}

    function countryLabelFor(code) {
      const found = ALL_COUNTRIES.find(c => c.code === code);
      return found ? (found.code + ' - ' + found.label) : (code || '');
    }

    /* Sums actual Order Request quantities into per-market and
       per-market+country totals. Waiting List entries are excluded —
       they haven't actually been allocated a slot yet, so they
       shouldn't count against the cap until they move to another
       status. */
    function computeUsage() {
      const byMarket = {};
      const byCountry = {};
      orders.forEach(o => {
        if (o.status === 'Waiting List') return;
        const qty = Number(o.qty) || 0;
        byMarket[o.marketCode] = (byMarket[o.marketCode] || 0) + qty;
        if (o.country) {
          const key = o.marketCode + '|' + o.country;
          byCountry[key] = (byCountry[key] || 0) + qty;
        }
      });
      return { byMarket, byCountry };
    }

    /* Mirrors computeUsage() but tallies the opposite set — only
       Waiting List entries — so the dashboard can show how much
       demand is queued up for a market/country beyond what's
       actually been allocated. */
    function computeWaitlist() {
      const byMarket = {};
      const byCountry = {};
      orders.forEach(o => {
        if (o.status !== 'Waiting List' || o.cancelled) return;
        const qty = Number(o.qty) || 0;
        byMarket[o.marketCode] = (byMarket[o.marketCode] || 0) + qty;
        if (o.country) {
          const key = o.marketCode + '|' + o.country;
          byCountry[key] = (byCountry[key] || 0) + qty;
        }
      });
      return { byMarket, byCountry };
    }

    function marketUsed(market, usage) {
      return usage.byMarket[market.code] || 0;
    }
    function countryUsed(marketCode, countryCode, usage) {
      return usage.byCountry[marketCode + '|' + countryCode] || 0;
    }
    function marketWaitlisted(market, waitlist) {
      return waitlist.byMarket[market.code] || 0;
    }
    function countryWaitlisted(marketCode, countryCode, waitlist) {
      return waitlist.byCountry[marketCode + '|' + countryCode] || 0;
    }

    /* For markets with no fixed country list (Buffer), builds the
       breakdown live from whatever countries were actually typed into
       that market's orders, instead of reading it off a preset list —
       this is how the Buffer card's "View countries" panel shows where
       the allocation actually went. Sorted by quantity, highest first. */
    function dynamicCountryUsage(marketCode, usage) {
      const prefix = marketCode + '|';
      const list = Object.keys(usage.byCountry)
        .filter(key => key.indexOf(prefix) === 0)
        .map(key => ({ code: key.slice(prefix.length), qty: usage.byCountry[key] }));
      list.sort((a, b) => b.qty - a.qty);
      return list;
    }

    function statusFor(used, total) {
      if (total <= 0) return 'normal';
      if (used >= total) return 'full';
      if (used / total >= 0.85) return 'near';
      return 'normal';
    }

    const STATUS_BAR   = { normal: 'bg-wheat', near: 'bg-caution', full: 'bg-urgent' };
    const FRACTION_TEXT = { normal: 'text-blackish', near: 'text-caution', full: 'text-urgent' };

    // A small per-market identity color (used only as a subtle accent
    // dot/top-edge, never for the utilization bar itself — that stays
    // wheat/caution/urgent so it always reads as a status signal).
    const MARKET_ACCENT = { APAC: '#B8926A', CC: '#92714F', EU: '#B79E8F', NAM: '#C08A3E', BUFFER: '#4C8C52' };

    function countryCellHtml(country, marketCode, usage, waitlist) {
      const used = countryUsed(marketCode, country.code, usage);
      const status = statusFor(used, country.total);
      const pct = Math.min(100, (used / country.total) * 100);
      const waitlisted = countryWaitlisted(marketCode, country.code, waitlist);
      return (
        '<div>' +
          '<div class="flex items-center justify-between gap-2">' +
            '<div class="flex items-center gap-1.5 flex-wrap min-w-0">' +
              '<span class="text-[12.5px] font-semibold text-blackish">' + country.code + '</span>' +
              (status === 'full' ? '<span class="limit-badge">Limit reached</span>' : '') +
            '</div>' +
            '<span class="shrink-0 text-[13px] font-semibold tabular-nums ' + FRACTION_TEXT[status] + '">' + used + '/' + country.total + '</span>' +
          '</div>' +
          '<div class="h-[5px] rounded-full bg-breath overflow-hidden mt-1">' +
            '<div class="h-full rounded-full ' + STATUS_BAR[status] + '" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-1.5 flex-wrap mt-1">' +
            '<span class="text-[10px] text-wheat-deep">' + country.label + '</span>' +
            (waitlisted > 0 ? '<span class="text-[10px] font-semibold text-urgent">' + waitlisted + ' waitlisted</span>' : '') +
          '</div>' +
        '</div>'
      );
    }

    /* Row for the Buffer card's dynamically-built breakdown — no fixed
       cap to show a bar against, just what's actually been typed in
       and how much went to it. */
    function dynamicCountryCellHtml(entry, marketTotal, accent) {
      const pctOfMarket = marketTotal ? Math.round((entry.qty / marketTotal) * 100) : 0;
      return (
        '<div class="flex items-center justify-between gap-2 py-1">' +
          '<span class="text-[12px] font-semibold text-blackish truncate">' + escapeHtml(entry.code) + '</span>' +
          '<span class="shrink-0 text-[12.5px] font-semibold tabular-nums" style="color:' + (accent || '#92714F') + ';">' + entry.qty + ' unit' + (entry.qty === 1 ? '' : 's') + ' &middot; ' + pctOfMarket + '%</span>' +
        '</div>'
      );
    }

    function marketCardHtml(market, usage, waitlist, extraClass) {
      const used = marketUsed(market, usage);
      const status = statusFor(used, market.total);
      const pct = Math.min(100, (used / market.total) * 100);
      const remaining = Math.max(0, market.total - used);
      const waitlisted = marketWaitlisted(market, waitlist);
      const hasCountries = market.splitCountries && market.countries.length > 0;
      const isDynamic = market.dynamicCountries === true;
      const panelId = 'countryPanel-' + market.code;
      const accent = MARKET_ACCENT[market.code] || '#B0B0B0';

      const toggle = (hasCountries || isDynamic)
        ? '<button type="button" data-role="toggle" data-target="' + panelId + '" ' +
            'class="focus-ring mt-1.5 inline-flex items-center gap-1 text-[11px] font-semibold text-blackish hover:text-wheat-deep" ' +
            'aria-expanded="false" aria-controls="' + panelId + '">' +
            '<span data-role="toggleLabel">View countries</span>' +
            '<svg class="chevron w-2.5 h-2.5" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>'
        : '<p class="mt-1.5 text-[10.5px] text-faint m-0 italic">Country-level split not tracked</p>';

      const dynamicList = isDynamic ? dynamicCountryUsage(market.code, usage) : [];

      const panel = hasCountries
        ? '<div id="' + panelId + '" class="country-panel absolute left-0 right-0 z-30 bg-white border border-wind rounded-lg shadow-lg p-3.5 max-h-80 overflow-y-auto" data-role="panel">' +
            '<div class="flex items-center justify-between gap-2 pb-2 mb-2.5 border-b border-breath">' +
              '<span class="text-[9.5px] font-semibold uppercase tracking-wide text-faint">' + market.code + ' &middot; Country Breakdown</span>' +
              '<span class="text-[10px] text-faint whitespace-nowrap">' + market.countries.length + ' countries</span>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-x-4 gap-y-2.5">' +
              market.countries.map(c => countryCellHtml(c, market.code, usage, waitlist)).join('') +
            '</div>' +
          '</div>'
        : (isDynamic
          ? '<div id="' + panelId + '" class="country-panel absolute left-0 right-0 z-30 bg-white border border-wind rounded-lg shadow-lg p-3.5 max-h-80 overflow-y-auto" data-role="panel" style="border-top:2.5px solid ' + accent + ';">' +
              '<div class="flex items-center justify-between gap-2 pb-2 mb-2.5 border-b border-breath">' +
                '<span class="text-[9.5px] font-semibold uppercase tracking-wide" style="color:' + accent + ';">' + market.code + ' &middot; Where it went</span>' +
                '<span class="text-[10px] text-faint whitespace-nowrap">' + dynamicList.length + ' countr' + (dynamicList.length === 1 ? 'y' : 'ies') + '</span>' +
              '</div>' +
              (dynamicList.length
                ? '<div class="flex flex-col divide-y divide-breath">' + dynamicList.map(d => dynamicCountryCellHtml(d, market.total, accent)).join('') + '</div>'
                : '<p class="text-[11px] text-faint m-0 italic">No allocations recorded yet — countries typed into Buffer order requests will show up here.</p>') +
            '</div>'
          : '');

      return (
        '<article class="relative lg:col-span-1 h-full bg-white border border-wind rounded-lg px-3 pt-2.5 pb-2.5 flex flex-col transition-shadow duration-150 hover:shadow-md' + (extraClass ? ' ' + extraClass : '') + '" style="border-top:2.5px solid ' + accent + ';">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<span class="text-[9.5px] font-semibold uppercase tracking-[0.08em] text-dim">Market</span>' +
            '<div class="flex items-center gap-1.5">' +
              '<span class="text-[13px] font-semibold tabular-nums ' + FRACTION_TEXT[status] + '">' + used + '/' + market.total + '</span>' +
              (waitlisted > 0 ? '<span class="waitlist-badge">' + waitlisted + ' waitlisted</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-1.5 flex-wrap mt-0.5">' +
            '<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:' + accent + ';"></span>' +
            '<span class="text-[16px] font-semibold text-blackish leading-tight">' + market.code + '</span>' +
            (status === 'full' ? '<span class="limit-badge">Limit reached</span>' : '') +
          '</div>' +
          '<div class="h-[6px] rounded-full bg-breath overflow-hidden mt-1.5">' +
            '<div class="h-full rounded-full ' + STATUS_BAR[status] + '" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<div class="flex items-center justify-between mt-1 text-[11px] font-semibold text-dim tabular-nums">' +
            '<span>' + remaining + ' remaining</span>' +
            '<span>' + Math.round(pct) + '%</span>' +
          '</div>' +
          toggle +
          panel +
        '</article>'
      );
    }

    function render() {
      const usage = computeUsage();
      const waitlist = computeWaitlist();
      const cardsEl = document.getElementById('marketCards');
      const bufferEl = document.getElementById('bufferCard');

      // Buffer gets its own card beside Total Allocation (below), so it's
      // left out of the regular market-cards grid to avoid showing twice.
      const gridMarkets = MARKETS.filter(m => !m.dynamicCountries);
      const bufferMarket = MARKETS.find(m => m.dynamicCountries);

      cardsEl.innerHTML = gridMarkets.map(m => marketCardHtml(m, usage, waitlist)).join('');
      if (bufferEl && bufferMarket) {
        bufferEl.innerHTML = marketCardHtml(bufferMarket, usage, waitlist, 'h-full');
      }

      const grandTotal = MARKETS.reduce((sum, m) => sum + m.total, 0);
      const grandUsed = MARKETS.reduce((sum, m) => sum + marketUsed(m, usage), 0);
      const bufferUsed = bufferMarket ? marketUsed(bufferMarket, usage) : 0;
      const baseUsedPct = Math.min(100, ((grandUsed - bufferUsed) / grandTotal) * 100);
      const bufferUsedPct = Math.min(100 - baseUsedPct, (bufferUsed / grandTotal) * 100);
      const grandPct = Math.min(100, (grandUsed / grandTotal) * 100);

      const grandTotalLabelEl = document.getElementById('grandTotalLabel');
      if (grandTotalLabelEl) grandTotalLabelEl.textContent = grandTotal;
      document.getElementById('grandBarBase').style.width = baseUsedPct + '%';
      document.getElementById('grandBarBuffer').style.width = bufferUsedPct + '%';
      document.getElementById('grandPctLabel').textContent = Math.round(grandPct) + '% used';
      document.getElementById('grandUsedLabel').textContent = grandUsed + ' used';
      document.getElementById('grandRemainingLabel').textContent = (grandTotal - grandUsed) + ' remaining';
      const bufferUsedLabelEl = document.getElementById('grandBufferUsedLabel');
      if (bufferUsedLabelEl) bufferUsedLabelEl.textContent = bufferUsed > 0 ? bufferUsed + ' from Buffer' : '';

      document.querySelectorAll('[data-role="toggle"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const panel = document.getElementById(btn.dataset.target);
          const willOpen = !panel.classList.contains('is-open');
          closeAllCountryPanels(willOpen ? panel : null);
          setCountryPanelState(btn, panel, willOpen);
        });
      });
      document.querySelectorAll('[data-role="panel"]').forEach(panel => {
        panel.addEventListener('click', (e) => e.stopPropagation());
      });
    }

    function setCountryPanelState(btn, panel, isOpen) {
      panel.classList.toggle('is-open', isOpen);
      btn.querySelector('.chevron').classList.toggle('is-open', isOpen);
      btn.setAttribute('aria-expanded', String(isOpen));
      btn.querySelector('[data-role="toggleLabel"]').textContent = isOpen ? 'Hide countries' : 'View countries';
    }

    function closeAllCountryPanels(except) {
      document.querySelectorAll('[data-role="panel"]').forEach(panel => {
        if (panel === except) return;
        const btn = document.querySelector('[data-target="' + panel.id + '"]');
        if (btn) setCountryPanelState(btn, panel, false);
      });
    }
    document.addEventListener('click', () => closeAllCountryPanels(null));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllCountryPanels(null); });

    /* ============================================================
       Order Requests — tabs swap which panel is visible; the actual
       row data/rendering lives in the block below.
       ============================================================ */
    const orderTabs = Array.from(document.querySelectorAll('.view-tab'));
    orderTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        orderTabs.forEach(t => {
          const isActive = t === tab;
          t.classList.toggle('active', isActive);
          t.setAttribute('aria-selected', String(isActive));
          const panel = document.getElementById(t.getAttribute('aria-controls'));
          if (panel) panel.classList.toggle('hidden', !isActive);
        });
      });
    });

    /* ============================================================
       Order Requests — data, form, search, tabs, toggle, pause.

       Storage: in the shipped demo this runs entirely in memory for
       the page view, so nothing is written to this browser and nothing
       leaves the page.

       Status → tab mapping: "Pending Request" covers both On Process
       and With Clarification (still active, not yet resolved either
       way); Completed and Waiting List each get their own tab.
       ============================================================ */
    const ORDERS_KEY = 'goatFramesOrders_v1';
    const DATA_ENDPOINT = '/api/data/goat-frames-tracker';
    const STATUS_LIST = ['On Process', 'With Clarification', 'Waiting List', 'Completed'];
    /* Inline pill colors, lifted straight from Manual Typing's palette
       (wheat = in-progress, dusty-rose = with clarification, sage =
       completed); Waiting List gets a plain wind-based neutral tint
       following that same recipe since it isn't in the source page. */
    const STATUS_META = {
      'On Process':         { bg: 'rgba(184, 146, 106, 0.25)', text: '#2D2D2B' },
      'With Clarification': { bg: 'rgba(212, 200, 190, 0.55)', text: '#2D2D2B' },
      'Waiting List':       { bg: 'rgba(161, 76, 76, 0.18)',   text: '#A14C4C' },
      'Completed':          { bg: '#C3D3BC',                   text: '#2D2D2B' }
    };
    /* Only these two statuses run the live clock — matches Manual
       Typing's "In Progress" + "With Clarification" both counting as
       active work. Waiting List behaves like Completed: the case
       isn't being worked on, so the clock simply isn't running (and
       can't be held/resumed either — there's nothing to pause). */
    const TRACKED_STATUSES = ['On Process', 'With Clarification'];
    // Labels used only in the Break Down display/export — same two
    // statuses that accumulate processing-time segments (see below).
    const BREAKDOWN_LABELS = { 'On Process': 'On Process', 'With Clarification': 'With Clarification' };
    const TAB_STATUSES = {
      pending:   ['On Process', 'With Clarification'],
      completed: ['Completed'],
      waiting:   ['Waiting List']
    };

    let orders = [];
    let orderSearchQuery = '';
    let showPtime = false;
    let ptimeInterval = null;
    // Permissions from the access check — optimistic defaults (full edit,
    // export hidden) until the server actually answers, matching the
    let isEditor = true;
    let canExtract = false;
    // Set right after a new entry is pushed, read once by the next
    // render to animate only that row in, then cleared — see row-enter.
    let justAddedOrderId = null;

    /* ---------- Storage: in the demo everything stays in memory for
       this page view only. ---------- */
    /* Demo build: state lives in memory for this page view only. */
    function loadOrdersLocal() { return []; }
    function saveOrdersLocal() { /* no storage in the demo */ }

    async function loadOrders() {
      // Demo build: the snapshot is inlined; nothing is fetched.

        var copy = Object.assign({}, o);

    /* The demo always runs as a full editor in this browser, with no
       server round trip and no shared access script. */
    async function fetchWhoAmI() {

      return { isEditor: true, canExtract: true };

    function setFormEditable(editable) {
      ['inDateReceived', 'inDateProcessed', 'inCaseNo', 'inSoldTo', 'inMarket', 'inCountry', 'inQty', 'inRemarks', 'orderSubmitBtn', 'importBtn']
        .forEach(id => {

    function setServerStatus(message, isWarning) {
      const el = document.getElementById('serverStatus');

      el.classList.toggle('text-urgent', !!isWarning);

      setServerStatus('Demo mode \u2014 changes aren\'t saved', true);
